<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — NexiBrain</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/img/nexibrain-icon.png">
  <meta name="theme-color" content="#0a0a1f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    .nf { min-height: 82vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .nf .code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(80px, 18vw, 160px);
      line-height: 1;
      background: linear-gradient(92deg, #1ca8ef, #6ee7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf h1 { font-size: clamp(22px, 4vw, 32px); margin: 14px 0 10px; }
    .nf p { color: var(--muted); margin-bottom: 30px; }
    .nf .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="nf">
    <div>
      <div class="code">404</div>
      <h1>Cette page n'existe pas (ou plus).</h1>
      <p>Pas de panique : tout ce qui compte est à portée de clic.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Retour à l'accueil</a>
        <a class="btn btn-ghost" href="/goalvision/">GoalVision</a>
        <a class="btn btn-ghost" href="/aura/">Aura</a>
      </div>
    </div>
  </main>
</body>
</html>
